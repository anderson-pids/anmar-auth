[project]
name = "anmar-auth"
version = "0.1.0"
description = "Cliente FastAPI para validar JWT/JWKS do anmar-apps gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anmar_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
